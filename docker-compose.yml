services:
  unitree_converse:
    build:
      context: .
      dockerfile: Dockerfile.humble
    image: unitree_converse:latest
    container_name: unitree_converse
    runtime: nvidia
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - LLM_API_MODEL=qwen2.5:3b
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount codebase into the ROS2 workspace
      - .:/root/ros2_ws/src/unitree_converse
      # Shared memory for CycloneDDS
      - /dev/shm:/dev/shm
      # Mount /home/unitree so g1_piper_tts binary and cyclonedds_ws are accessible if present
      - /home/unitree:/home/unitree:ro
    command: >
      bash -c "
        ROBOT_IFACE=$$(ip -4 -o addr show | awk '/192\\.168\\.123\\./ {print $$2; exit}') &&
        ROBOT_IFACE=$${ROBOT_IFACE:-enP8p1s0} &&
        if [ -f /home/unitree/cyclonedds_ws/cyclonedds.xml ]; then
          export CYCLONEDDS_URI=/home/unitree/cyclonedds_ws/cyclonedds.xml;
        else
          printf '<CycloneDDS><Domain><General><Interfaces><NetworkInterface name=\"%s\"/></Interfaces></General></Domain></CycloneDDS>\n' \"$$ROBOT_IFACE\" > /tmp/cyclonedds.xml &&
          export CYCLONEDDS_URI=file:///tmp/cyclonedds.xml;
        fi &&
        source /opt/ros/humble/setup.bash &&
        if [ -f /root/unitree_ros2_ws/install/setup.bash ]; then
          source /root/unitree_ros2_ws/install/setup.bash;
        fi &&
        if [ -f /home/unitree/cyclonedds_ws/install/setup.bash ]; then
          source /home/unitree/cyclonedds_ws/install/setup.bash;
        fi &&
        cd /root/ros2_ws &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        echo \"Starting unitree_converse voice pipeline on robot (interface: $$ROBOT_IFACE)...\" &&
        ros2 launch g1_voice voice_real.launch.py
      "
