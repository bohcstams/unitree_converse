/llm_node:
  ros__parameters:
    api_url: "http://localhost:11434/v1"
    api_key: "no_key"
    api_model: "qwen2.5:3b"
    system_prompt: "Máté vagy, a Budapesti Műszaki és Gazdaságtudományi Egyetem (BME) barátságos Unitree G1-Edu humanoid robotja. Két feladatod van: 1. Bemutatkozás: ha kérdezik, barátságosan mondd el, hogy ki vagy és hol vagy. 2. Asztali tárgyrendezési feladatok: a beépített 3D kameráddal felismered az asztalon lévő tárgyakat, és a kezeiddel áthelyezed vagy dobozba pakolod őket a kapott hangutasítás alapján. Szabályok: Mindig természetes, udvarias magyar nyelven válaszolj! Mivel élőszóban beszélsz a hangszórón át, a válaszod MINDIG KIZÁRÓLAG 1 vagy 2 rövid mondat legyen! Soha ne használj formázást, csillagokat vagy felsorolást! Példák: Kérdés: Szia, mesélj magadról! Válasz: Szia! Máté vagyok, a BME Unitree G1 humanoid robotja, és asztali tárgyak rendezésével foglalkozom. Kérdés: Tedd a kockát a dobozba! Válasz: Rendben, megkeresem a kamerámmal a kockát és átrakom a dobozba."
    temperature: 0.3
    max_tokens: 60
    max_history_length: 6
    stream: false

/stt_node:
  ros__parameters:
    use_udp_mic: true
    continuous_mode: false
    udp_multicast_group: "239.168.123.161"
    udp_port: 5555
    udp_local_ip: "192.168.123.164"
    model_size: "small"
    language: "hu"
    device: "cuda"
    compute_type: "float16"
    beam_size: 1
    cpu_threads: 4
    initial_prompt: "Szia Máté! Kérlek keresd meg az asztalon a tárgyakat, vedd fel a kockát és tedd át a dobozba."
    sample_rate: 16000
    recording_duration: 8.0
    silence_threshold: 0.008
    silence_duration: 2.0

/wake_word_node:
  ros__parameters:
    wake_word_model: "hey_jarvis"
    detection_threshold: 0.5
    sample_rate: 16000
    chunk_duration: 0.08
    use_wake_word: false
    use_select_button: false
    select_key: "s"

/tts_node:
  ros__parameters:
    voice_model_path: "/home/unitree/.local/share/piper/hu_HU-imre-medium.onnx"
    continuous_mode: false
    use_cuda: false
    output_device: 25
    output_sample_rate: 44100
    tts_mode: "binary"
    piper_binary: "/usr/local/bin/piper"
