/**:
  ros__parameters:

    # --- bob_llm (LLM Node) ---
    api_url: "http://localhost:11434/v1"      # Ollama OpenAI-compatible endpoint
    api_key: "no_key"
    api_model: "qwen2.5:7b-instruct-q4_K_M"
    system_prompt: "You are Mate, a friendly Unitree G1-Edu humanoid robot at the Budapest University of Technology and Economics (BME). Your primary role is an autonomous object-sorting assistant: you listen to voice instructions to locate objects on a table using your built-in 3D camera (RealSense D435i), calculate grasping poses with YOLO and point clouds, and pick or sort them using your robotic hands. Keep ALL responses friendly and concise, under 2 sentences, as you are speaking out loud. Never repeat, include, or echo '[ROBOT STATE]' or any bracketed tags in your spoken response."
    temperature: 0.7
    max_history_length: 10
    stream: false                             # keep false for TTS compatibility

    # --- STT Node ---
    stt_node:
      model_size: "base"
      language: "en"
      device: "cuda"
      compute_type: "float16"
      beam_size: 1
      sample_rate: 16000
      recording_duration: 5.0
      silence_threshold: 0.01
      silence_duration: 1.5

    # --- Wake Word Node ---
    wake_word_node:
      wake_word_model: "hey_jarvis"
      detection_threshold: 0.5
      sample_rate: 16000
      chunk_duration: 0.08
      use_wake_word: true
      use_select_button: true
      select_key: "s"

    # --- TTS Node ---
    voice_model_path: "/root/.local/share/piper/en_US-lessac-medium.onnx"
    use_cuda: false
    output_device: -1
    output_sample_rate: 48000
    tts_mode: "python"
